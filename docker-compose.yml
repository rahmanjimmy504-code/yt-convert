# One-VPS stack: Next.js app + BgUtils PO-token sidecar + Caddy.
#
# The sidecar is NOT published to the internet. It lives on the private
# Docker network so the app and the generator share an egress IP (the
# Android same-egress experiment: PO tokens only clear BotGuard when mint
# and Innertube extraction come from the same address).
#
#   cp .env.example .env   # set AUTH_TOKEN, CONVERT_TICKET_SECRET, SITE_ADDRESS
#   docker compose up -d --build

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: yt-convert-web:latest
    restart: unless-stopped
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      PO_TOKEN_SERVER_URL: http://po-token:4416
      PO_TOKEN_SERVER_AUTH: ${AUTH_TOKEN}
      CONVERT_TICKET_SECRET: ${CONVERT_TICKET_SECRET:-${CAPTCHA_SECRET:-change-me}}
      CAPTCHA_SECRET: ${CAPTCHA_SECRET:-change-me}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
      YT_API_KEY: ${YT_API_KEY:-}
      COBALT_API_URL: ${COBALT_API_URL:-}
      COBALT_API_AUTH: ${COBALT_API_AUTH:-}
      COBALT_PROXY_HOSTS: ${COBALT_PROXY_HOSTS:-}
      PIPED_PROXY_HOSTS: ${PIPED_PROXY_HOSTS:-}
      YT_EGRESS_PROXY: ${YT_EGRESS_PROXY:-}
    depends_on:
      po-token:
        condition: service_healthy
    networks:
      - internal
    expose:
      - "3000"

  po-token:
    build:
      context: ./po-token-server
      dockerfile: Dockerfile
    image: yt-convert-po-token-server:latest
    restart: unless-stopped
    environment:
      PORT: "4416"
      HOST: "0.0.0.0"
      AUTH_TOKEN: ${AUTH_TOKEN:?set AUTH_TOKEN in .env}
      TOKEN_TTL_MS: ${TOKEN_TTL_MS:-1800000}
      YT_EGRESS_PROXY: ${YT_EGRESS_PROXY:-}
    networks:
      - internal
    expose:
      - "4416"
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # Self-hosted cobalt: the last-resort fallback when YouTube bot-blocks this
  # server's IP. Optional — the stack runs fine without it (the app just falls
  # through to the reviewed public instances, then to an honest error).
  #
  # WHY IT HAS A PUBLIC HOSTNAME INSTEAD OF LIVING ONLY ON THE PRIVATE NETWORK:
  # cobalt builds its tunnel URLs from API_URL, and /api/convert refuses any
  # media URL that is not HTTPS (see isAllowedMediaUrl). With an internal
  # http://cobalt:9000 the tunnels would come back as http and be rejected, so
  # the fallback would silently never work. Caddy therefore terminates TLS for
  # a cobalt subdomain, and API_AUTH_REQUIRED below stops strangers using it.
  cobalt:
    image: ghcr.io/imputnet/cobalt:11
    init: true
    read_only: true
    restart: unless-stopped
    environment:
      # MUST be the public URL, with the trailing slash, or tunnels break.
      API_URL: "https://${COBALT_SITE_ADDRESS:-cobalt.localhost}/"
      # Require a key so only this app can use the instance.
      API_KEY_URL: "file:///keys.json"
      API_AUTH_REQUIRED: "1"
      # Ask the session sidecar for YouTube poToken/visitor_data. This is what
      # gives the instance a chance against the bot wall; without it a plain
      # datacenter IP usually gets error.api.youtube.login.
      YOUTUBE_SESSION_SERVER: "http://yt-session:8080/"
      # Tunnels are single-use and short-lived; 300s leaves room for a slow
      # phone connection to finish the download.
      TUNNEL_LIFESPAN: "300"
    volumes:
      - ./keys.json:/keys.json:ro
    networks:
      - internal
    expose:
      - "9000"

  # Generates YouTube poToken + visitor_data for cobalt. Not published: it
  # shares the private network (and therefore the egress IP) with cobalt,
  # which is the whole point — a token minted from a different IP is useless.
  yt-session:
    image: ghcr.io/imputnet/yt-session-generator:webserver
    init: true
    restart: unless-stopped
    networks:
      - internal
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      COBALT_SITE_ADDRESS: ${COBALT_SITE_ADDRESS:-cobalt.localhost}
      CADDY_EMAIL: ${CADDY_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
