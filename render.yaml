# One-click deploy to Render's free tier (no credit card required).
#
#   https://render.com/deploy?repo=https://github.com/rahmanjimmy504-code/yt-convert
#
# Render builds the existing Dockerfile and injects $PORT, which the Next.js
# standalone server already honours — no code changes needed.
#
# WHAT THE FREE PLAN GIVES YOU
#   - a permanent https://<name>.onrender.com address
#   - 750 instance-hours/month (enough for one always-listening service)
#   - 100 GB/month bandwidth
#
# THE TWO FREE-PLAN CATCHES
#   1. The service sleeps after 15 minutes idle; the next visitor waits
#      ~30-60 s while it wakes. Subsequent requests are normal speed.
#   2. Render runs in a datacenter, so YouTube will very likely bot-block
#      direct extraction from it. That is expected and NOT fatal: the app
#      falls through to the 9Convert farm (which extracts on its own egress)
#      and to the converter cards, which hand off to the visitor's browser.
#      See docs/setup-free.md.
#
# The three secrets below are generated by Render and kept stable, so
# download tickets stay valid. Cobalt is left unset deliberately: a
# datacenter instance cannot clear YouTube's bot wall anyway, and public
# discovery already runs without configuration.
services:
  - type: web
    name: yt-convert
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      # Stable across restarts and instances: /api/convert rejects tickets
      # signed with a different secret than /api/video-info used.
      - key: CONVERT_TICKET_SECRET
        generateValue: true
      - key: CAPTCHA_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      # Render exposes the service's own URL; metadata/robots/sitemap use it.
      - key: NEXT_PUBLIC_SITE_URL
        fromService:
          type: web
          name: yt-convert
          envVarKey: RENDER_EXTERNAL_URL
