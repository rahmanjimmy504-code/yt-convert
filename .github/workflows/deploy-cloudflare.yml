# >>> SOURCE-OF-TRUTH COPY — the Arena/GitHub integration cannot write to
# >>> .github/workflows/. After merging, copy this file OVER
# >>> .github/workflows/deploy-cloudflare.yml via the GitHub web UI
# >>> (repo > .github/workflows > edit > replace all > commit).
#
name: Deploy to Cloudflare

on:
  workflow_dispatch:
  push:
    # Deploy on ANY change that lands on main — no path filter. Whatever is
    # merged (src, public, docs, configs, the workflow itself, anything)
    # triggers the build + deploy, so the live Worker never lags behind main.
    # Runs can still be kicked off manually from the Actions tab above.
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check Cloudflare credentials
    runs-on: ubuntu-latest
    outputs:
      have_credentials: ${{ steps.check.outputs.have_credentials }}
    steps:
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "have_credentials=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_credentials=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Skipped — token missing
        if: steps.check.outputs.have_credentials == 'false'
        run: |
          echo "::warning title=Cloudflare deploy skipped::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID are not set. Add them under Settings → Secrets and variables → Actions, then run this workflow again (see docs/setup-cloudflare.md)."
          echo "skipped — token missing"

  deploy:
    name: Build and deploy Worker
    needs: check
    if: needs.check.outputs.have_credentials == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the Workers bundle
        run: npm run cf:build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          # Public NEXT_PUBLIC_* values are inlined into the client bundle at build time.
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
          NEXT_PUBLIC_HCAPTCHA_SITE_KEY: ${{ secrets.NEXT_PUBLIC_HCAPTCHA_SITE_KEY }}
          NEXT_PUBLIC_YT_COOKIES_ENABLED: ${{ secrets.NEXT_PUBLIC_YT_COOKIES_ENABLED }}

      # Order matters here. Cloudflare refuses a secret edit while the newest
      # Worker version is not the deployed one —
      #   "Secret edit failed. You attempted to modify a secret, but the latest
      #    version of your Worker isn't currently deployed."
      # which is exactly the state any dashboard edit leaves the Worker in.
      # Deploying first makes the newest version the deployed one, so every
      # `secret put` can succeed; the final deploy then guarantees the running
      # version carries the secrets that were just uploaded.
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run cf:deploy

      - name: Upload runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CAPTCHA_SECRET: ${{ secrets.CAPTCHA_SECRET }}
          CONVERT_TICKET_SECRET: ${{ secrets.CONVERT_TICKET_SECRET }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY }}
          HCAPTCHA_SECRET_KEY: ${{ secrets.HCAPTCHA_SECRET_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -e
          # OPENAI_MODEL is deliberately NOT here: it is a model name, not a
          # credential, and it lives in wrangler.jsonc "vars" instead. Keeping
          # it out of this loop also fixes a hard failure — `wrangler secret
          # put` refuses any name that already exists as a dashboard *Text var*
          # ("Binding name 'OPENAI_MODEL' already in use [code 10053]").
          #
          # TURNSTILE_SECRET_KEY is the only Turnstile value the server needs at
          # runtime; the site key is inlined into the client bundle at build
          # time above, so it is not uploaded as a secret.
          for name in CAPTCHA_SECRET CONVERT_TICKET_SECRET ADMIN_TOKEN TURNSTILE_SECRET_KEY RECAPTCHA_SECRET_KEY HCAPTCHA_SECRET_KEY GROQ_API_KEY OPENAI_API_KEY; do
            eval "value=\"\${$name}\""
            if [ -n "$value" ]; then
              if ! printf '%s' "$value" | npx wrangler secret put "$name"; then
                echo "::error title=Could not upload $name::wrangler refused this secret. The usual cause is a dashboard *Text var* (Settings → Variables and Secrets) with the same name — delete that Text var and re-run, or move the value into wrangler.jsonc \"vars\" if it is not sensitive."
                exit 1
              fi
            else
              echo "::notice title=$name not set::Skipped. Add it under Settings → Secrets and variables → Actions if this deployment needs it (see docs/setup-cloudflare.md)."
            fi
          done

      - name: Redeploy so the uploaded secrets take effect
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run cf:deploy
