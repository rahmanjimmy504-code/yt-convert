name: Deploy to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check Cloudflare credentials
    runs-on: ubuntu-latest
    outputs:
      have_credentials: ${{ steps.check.outputs.have_credentials }}
    steps:
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "have_credentials=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_credentials=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Skipped — token missing
        if: steps.check.outputs.have_credentials == 'false'
        run: |
          echo "::warning title=Cloudflare deploy skipped::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID are not set. Add them under Settings → Secrets and variables → Actions, then run this workflow again (see docs/setup-cloudflare.md)."
          echo "skipped — token missing"

  deploy:
    name: Build and deploy Worker
    needs: check
    if: needs.check.outputs.have_credentials == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the Workers bundle
        run: npm run cf:build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
          NEXT_PUBLIC_HCAPTCHA_SITE_KEY: ${{ secrets.NEXT_PUBLIC_HCAPTCHA_SITE_KEY }}
          NEXT_PUBLIC_YT_COOKIES_ENABLED: ${{ secrets.NEXT_PUBLIC_YT_COOKIES_ENABLED }}

      - name: Deploy Worker code
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run cf:deploy

      - name: Upload runtime secrets to a new Worker version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CAPTCHA_SECRET: ${{ secrets.CAPTCHA_SECRET }}
          CONVERT_TICKET_SECRET: ${{ secrets.CONVERT_TICKET_SECRET }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY }}
          HCAPTCHA_SECRET_KEY: ${{ secrets.HCAPTCHA_SECRET_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          jq -n \
            --arg captcha "$CAPTCHA_SECRET" \
            --arg ticket "$CONVERT_TICKET_SECRET" \
            --arg admin "$ADMIN_TOKEN" \
            --arg turnstile "$TURNSTILE_SECRET_KEY" \
            --arg recaptcha "$RECAPTCHA_SECRET_KEY" \
            --arg hcaptcha "$HCAPTCHA_SECRET_KEY" \
            --arg groq "$GROQ_API_KEY" \
            --arg openai "$OPENAI_API_KEY" \
            '{
              CAPTCHA_SECRET: $captcha,
              CONVERT_TICKET_SECRET: $ticket,
              ADMIN_TOKEN: $admin,
              TURNSTILE_SECRET_KEY: $turnstile,
              RECAPTCHA_SECRET_KEY: $recaptcha,
              HCAPTCHA_SECRET_KEY: $hcaptcha,
              GROQ_API_KEY: $groq,
              OPENAI_API_KEY: $openai
            } | with_entries(select(.value != ""))' > runtime-secrets.json

          npx wrangler versions secret bulk runtime-secrets.json \
            --name yt-convert \
            --message "Update runtime secrets"
          rm -f runtime-secrets.json

      - name: Deploy the version containing the runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Do not pipe Wrangler directly into awk. Wrangler writes progress
          # output to stdout, and awk exits after the first match; that closes
          # Wrangler's stdout early and can make Node throw EPIPE.
          npx wrangler versions list --name yt-convert > wrangler-versions.txt
          VERSION_ID="$(awk '/Version ID:/ {print $3; exit}' wrangler-versions.txt)"
          rm -f wrangler-versions.txt
          if [ -z "$VERSION_ID" ]; then
            echo "Could not determine the newly-created Worker version ID."
            exit 1
          fi
          echo "Deploying Worker version $VERSION_ID"
          npx wrangler versions deploy "${VERSION_ID}@100%" --name yt-convert -y
