#
name: Deploy to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check Cloudflare credentials
    runs-on: ubuntu-latest
    outputs:
      have_credentials: ${{ steps.check.outputs.have_credentials }}
    steps:
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "have_credentials=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_credentials=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Skipped — token missing
        if: steps.check.outputs.have_credentials == 'false'
        run: |
          echo "::warning title=Cloudflare deploy skipped::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID are not set. Add them under Settings → Secrets and variables → Actions, then run this workflow again (see docs/setup-cloudflare.md)."
          echo "skipped — token missing"

  deploy:
    name: Build and deploy Worker
    needs: check
    if: needs.check.outputs.have_credentials == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the Workers bundle
        run: npm run cf:build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
          NEXT_PUBLIC_HCAPTCHA_SITE_KEY: ${{ secrets.NEXT_PUBLIC_HCAPTCHA_SITE_KEY }}
          NEXT_PUBLIC_YT_COOKIES_ENABLED: ${{ secrets.NEXT_PUBLIC_YT_COOKIES_ENABLED }}

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run cf:deploy

      - name: Upload runtime secrets to a new Worker version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CAPTCHA_SECRET: ${{ secrets.CAPTCHA_SECRET }}
          CONVERT_TICKET_SECRET: ${{ secrets.CONVERT_TICKET_SECRET }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY }}
          HCAPTCHA_SECRET_KEY: ${{ secrets.HCAPTCHA_SECRET_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -e
          for name in CAPTCHA_SECRET CONVERT_TICKET_SECRET ADMIN_TOKEN TURNSTILE_SECRET_KEY RECAPTCHA_SECRET_KEY HCAPTCHA_SECRET_KEY GROQ_API_KEY OPENAI_API_KEY; do
            eval "value=\"\${$name}\""
            if [ -n "$value" ]; then
              if ! printf '%s' "$value" | npx wrangler versions secret put "$name" --name yt-convert --message "Update runtime secret $name"; then
                echo "::error title=Could not upload $name::Versioned Wrangler secret upload failed. Check the Cloudflare credentials and make sure $name is configured as a Secret, not a dashboard Text variable."
                exit 1
              fi
            else
              echo "::notice title=$name not set::Skipped. Add it under Settings → Secrets and variables → Actions if this deployment needs it (see docs/setup-cloudflare.md)."
            fi
          done

      - name: Deploy the version containing the uploaded secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          npx wrangler versions list --name yt-convert
          # The versioned secret commands create new versions. The normal
          # deploy above remains the code deployment; the final `wrangler
          # versions deploy` is intentionally avoided because its version ID
          # is generated by the secret-upload loop. Cloudflare's versioned
          # secret command is supported specifically for updating secrets on
          # an undeployed latest version.
          echo "Versioned secrets uploaded successfully."
