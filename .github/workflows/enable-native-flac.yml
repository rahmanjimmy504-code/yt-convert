name: Enable native FLAC on older Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace framework-only FLAC with pure Kotlin FLAC writer
        shell: python
        run: |
          from pathlib import Path

          pure = r'''// SPDX-License-Identifier: GPL-3.0-or-later
package io.github.rahmanjimmy504.ytconvert.plugins.ytextractor

import java.nio.ByteBuffer
import java.nio.ByteOrder

/** Dependency-free FLAC writer using lossless VERBATIM subframes. */
class PureFlacEncoder(
    private val handle: MediaStoreSaver.RawHandle,
    private val sampleRate: Int,
    private val channels: Int,
    private val blockSize: Int = 4096,
) {
    private var totalSamples = 0L
    private var bytes = 0L
    private var frameNumber = 0L

    init {
        require(channels in 1..2) { "FLAC supports mono/stereo PCM here." }
        require(sampleRate in 1..65535000) { "Invalid FLAC sample rate." }
        val streamInfo = ByteArray(34)
        putU16(streamInfo, 0, blockSize)
        putU16(streamInfo, 2, blockSize)
        val rateChannelsBps = (sampleRate.toLong() shl 44) or
            ((channels - 1L) shl 41) or (15L shl 36)
        putU64Partial(streamInfo, 10, rateChannelsBps)
        handle.write(byteArrayOf(0x66, 0x4c, 0x61, 0x43), 0, 4)
        handle.write(byteArrayOf(0x80.toByte(), 0, 0, 0x22), 0, 4)
        handle.write(streamInfo, 0, streamInfo.size)
        bytes += 42
    }

    fun writePcm(buffer: ByteBuffer, frames: Int) {
        buffer.order(ByteOrder.LITTLE_ENDIAN)
        val samples = ShortArray(frames * channels)
        buffer.asShortBuffer().get(samples)
        var offset = 0
        while (offset < frames) {
            val count = minOf(blockSize, frames - offset)
            writeFrame(samples, offset, count)
            offset += count
            totalSamples += count
        }
    }

    fun finish() {
        val value = totalSamples and ((1L shl 36) - 1)
        val patch = byteArrayOf(
            ((value ushr 32) and 0x0f).toByte(),
            (value ushr 24).toByte(), (value ushr 16).toByte(),
            (value ushr 8).toByte(), value.toByte(),
        )
        handle.patch(13, patch)
    }

    fun close() = handle.close()
    fun bytesWritten(): Long = bytes

    private fun writeFrame(samples: ShortArray, offsetFrames: Int, frames: Int) {
        val headerBits = BitWriter()
        headerBits.writeBits(0x3ffe, 14)
        headerBits.writeBits(0, 1)
        headerBits.writeBits(0, 1)
        headerBits.writeBits(6, 4)
        headerBits.writeBits(13, 4) // 16-bit sample rate in Hz (exact, e.g. 44100)
        headerBits.writeBits(channels - 1, 4)
        headerBits.writeBits(4, 3)
        headerBits.writeBits(0, 1)
        writeUtf8(headerBits, frameNumber++)
        headerBits.writeBits(frames - 1, 8)
        headerBits.writeBits(sampleRate, 16)
        headerBits.alignZero()
        val header = headerBits.toByteArray()
        val crc8 = crc8(header)

        val body = BitWriter()
        for (ch in 0 until channels) {
            body.writeBits(0, 1)
            body.writeBits(1, 6)
            body.writeBits(0, 1)
            for (i in 0 until frames) {
                val sample = samples[(offsetFrames + i) * channels + ch].toInt()
                body.writeBits(sample and 0xffff, 16)
            }
        }
        body.alignZero()
        val bodyBytes = body.toByteArray()
        val frame = ByteArray(header.size + 1 + bodyBytes.size + 2)
        System.arraycopy(header, 0, frame, 0, header.size)
        frame[header.size] = crc8.toByte()
        System.arraycopy(bodyBytes, 0, frame, header.size + 1, bodyBytes.size)
        val crc16 = crc16(frame, frame.size - 2)
        frame[frame.size - 2] = (crc16 ushr 8).toByte()
        frame[frame.size - 1] = crc16.toByte()
        handle.write(frame, 0, frame.size)
        bytes += frame.size
    }

    private class BitWriter {
        private val data = ArrayList<Byte>()
        private var current = 0
        private var used = 0
        fun writeBits(value: Int, count: Int) {
            for (i in count - 1 downTo 0) {
                current = (current shl 1) or ((value ushr i) and 1)
                used++
                if (used == 8) { data.add(current.toByte()); current = 0; used = 0 }
            }
        }
        fun alignZero() { if (used != 0) { current = current shl (8 - used); data.add(current.toByte()); current = 0; used = 0 } }
        fun toByteArray(): ByteArray = data.toByteArray()
    }

    private fun writeUtf8(out: BitWriter, value: Long) {
        when {
            value < 0x80 -> out.writeBits(value.toInt(), 8)
            value < 0x800 -> { out.writeBits(0xC0 or (value.toInt() ushr 6), 8); out.writeBits(0x80 or (value.toInt() and 0x3f), 8) }
            value < 0x10000 -> { out.writeBits(0xE0 or (value.toInt() ushr 12), 8); out.writeBits(0x80 or ((value.toInt() ushr 6) and 0x3f), 8); out.writeBits(0x80 or (value.toInt() and 0x3f), 8) }
            else -> { out.writeBits(0xF0 or (value.toInt() ushr 18), 8); out.writeBits(0x80 or ((value.toInt() ushr 12) and 0x3f), 8); out.writeBits(0x80 or ((value.toInt() ushr 6) and 0x3f), 8); out.writeBits(0x80 or (value.toInt() and 0x3f), 8) }
        }
    }
    private fun crc8(data: ByteArray): Int { var crc = 0; for (b in data) { crc = crc xor (b.toInt() and 0xff); repeat(8) { crc = if ((crc and 0x80) != 0) ((crc shl 1) xor 0x07) and 0xff else (crc shl 1) and 0xff } }; return crc }
    private fun crc16(data: ByteArray, length: Int): Int { var crc = 0; for (i in 0 until length) { crc = crc xor ((data[i].toInt() and 0xff) shl 8); repeat(8) { crc = if ((crc and 0x8000) != 0) ((crc shl 1) xor 0x8005) and 0xffff else (crc shl 1) and 0xffff } }; return crc }
    private fun putU16(a: ByteArray, p: Int, v: Int) { a[p] = (v ushr 8).toByte(); a[p + 1] = v.toByte() }
    private fun putU64Partial(a: ByteArray, p: Int, v: Long) { for (i in 0 until 8) a[p + i] = (v ushr (56 - i * 8)).toByte() }
}
'''
          Path('android-app/android/app/src/main/java/io/github/rahmanjimmy504/ytconvert/plugins/ytextractor/PureFlacEncoder.kt').write_text(pure)

          p = Path('android-app/android/app/src/main/java/io/github/rahmanjimmy504/ytconvert/plugins/ytextractor/AudioTranscoder.kt')
          s = p.read_text()
          start = s.index('    private class FlacSink(')
          end = s.index('    /**\n     * MediaCodec Opus encoder', start)
          replacement = '''    /** Dependency-free FLAC sink; works from the app's minSdk without a framework encoder. */
    private class FlacSink(
        handle: MediaStoreSaver.RawHandle,
        sampleRate: Int,
        channels: Int,
    ) : PcmSink {
        private val encoder = PureFlacEncoder(handle, sampleRate, channels)
        override fun writePcm(buffer: ByteBuffer, frames: Int) = encoder.writePcm(buffer, frames)
        override fun finish() = encoder.finish()
        override fun close() = encoder.close()
        override fun bytesWritten(): Long = encoder.bytesWritten()
    }

'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)

          fp = Path('android-app/android/app/src/main/java/io/github/rahmanjimmy504/ytconvert/plugins/ytextractor/FormatPicker.kt')
          s = fp.read_text().replace('const val FLAC_MIN_API = 31', 'const val FLAC_MIN_API = BASE_API_LEVEL').replace('/** FLAC needs the framework encoder first relied on from Android 12. */', '/** FLAC uses the bundled dependency-free encoder and works from minSdk. */')
          fp.write_text(s)

          ft = Path('android-app/src/lib/formats.ts')
          s = ft.read_text().replace('minApiLevel: 31,', 'minApiLevel: MIN_API_LEVEL,', 1)
          s = s.replace('the framework FLAC encoder is only relied on from\n * Android 12, the Opus encoder from Android 10.', 'FLAC uses the bundled dependency-free encoder; Opus uses the framework encoder from Android 10.')
          ft.write_text(s)

          test = Path('android-app/src/lib/formats.test.ts')
          s = test.read_text().replace("it('gates FLAC to API 31+ and Opus to API 29+ (mirrors FormatPicker.kt)'", "it('keeps FLAC available from minSdk and gates Opus to API 29+ (mirrors FormatPicker.kt)'")
          s = s.replace("expect(TARGETS.flac.minApiLevel).toBe(31);", "expect(TARGETS.flac.minApiLevel).toBe(MIN_API_LEVEL);")
          s = s.replace("expect(targetAvailable('flac', 28)).toBe(false);", "expect(targetAvailable('flac', 28)).toBe(true);")
          s = s.replace("expect(targetAvailable('flac', 29)).toBe(false);", "expect(targetAvailable('flac', 29)).toBe(true);")
          s = s.replace("expect(targetAvailable('flac', null)).toBe(false);", "expect(targetAvailable('flac', null)).toBe(true);")
          s = s.replace("expect(targetUnavailableReason('flac', null)).toContain('device version unknown');", "expect(targetUnavailableReason('flac', null)).toBeNull();")
          s = s.replace("expect(targetUnavailableReason('flac', 28)).toBe('Needs Android 12+.');", "expect(targetUnavailableReason('flac', 28)).toBeNull();")
          test.write_text(s)
          Path('.github/workflows/enable-native-flac.yml').unlink()

      - name: Run tests
        run: |
          npm ci
          npm run lint
          npm run test -- --run

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-app src .github/workflows/enable-native-flac.yml
          git commit -m "feat: enable FLAC on all supported Android versions"
          git push
