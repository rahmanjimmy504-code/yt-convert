name: Repair live media fallbacks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install browser FFmpeg WASM
        run: npm install @ffmpeg/ffmpeg@0.12.15 @ffmpeg/util@0.12.2 --save

      - name: Repair extraction and conversion paths
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          changed = []

          # MP3 is the only format that should require an MP3 transcode.
          p = Path('src/lib/extract.ts')
          s = p.read_text()
          s2 = re.sub(r"const needTranscodedMp3 = want === 'audio'", "const needTranscodedMp3 = format === 'mp3'", s, count=1)
          if s2 != s:
              s = s2
              changed.append('MP3-only transcode routing')

          # YouTube's AAC track is normally audio/mp4 with an mp4a codec, not
          # audio/aac. Accept both representations as AAC/M4A native audio.
          old = "if (requestedAudio === 'aac') return /audio\\/aac/i.test(mime);"
          new = "if (requestedAudio === 'aac') return /audio\\/(aac|mp4)/i.test(mime) || /mp4a/i.test(mime);"
          s2 = s.replace(old, new, 1)
          if s2 != s:
              s = s2
              changed.append('AAC native MIME matching')

          # Cobalt can provide real Opus even when Innertube returned some
          # unrelated audio formats. Let the Cobalt path run when no native
          # Opus candidate exists instead of returning early.
          old = "if (!formats.length && !excludedSources.has('cobalt') && isCobaltConfigured()) {"
          new = "const hasNativeOpus = formats.some(f => f.url && /audio\\/(opus|ogg|webm)/i.test(f.mimeType || ''));\n  if ((!formats.length || (format === 'opus' && !hasNativeOpus)) && !excludedSources.has('cobalt') && isCobaltConfigured()) {"
          s2 = s.replace(old, new, 1)
          if s2 != s:
              s = s2
              changed.append('Opus Cobalt fallback')
          p.write_text(s)

          # A provider can return a valid-looking URL that later refuses the
          # Worker egress. Retry with that provider excluded instead of giving
          # up immediately. This is especially important for googlevideo URLs
          # whose signatures are tied to the extractor's egress IP.
          p = Path('src/app/api/convert/route.ts')
          s = p.read_text()
          old = """      const upstream = await fetchAllowedMedia(streamUrl, { headers: upstreamHeaders });
      if ((!upstream.ok && upstream.status !== 206) || !upstream.body) {
        recordEvent({ type: 'lookup', platform, ok: false, error: 'convert upstream' });
        return json('The media host refused the stream. Try a converter below.', 502);
      }
"""
          new = """      const upstream = await fetchAllowedMedia(streamUrl, { headers: upstreamHeaders });
      if ((!upstream.ok && upstream.status !== 206) || !upstream.body) {
        const source = wrongSourceFor(extracted);
        if ((platform === 'youtube' || platform === 'youtubemusic') && source && attempt < MAX_CONVERT_ATTEMPTS && !excludedSources.has(source)) {
          previousWrongSource = source;
          console.warn(`[convert] media host refused ${format}; excluding ${source} and retrying`);
          continue;
        }
        recordEvent({ type: 'lookup', platform, ok: false, error: 'convert upstream' });
        return json('The media host refused the stream. Try a converter below.', 502);
      }
"""
          if old not in s:
              raise SystemExit('Could not find upstream refusal block')
          s = s.replace(old, new, 1)
          p.write_text(s)
          changed.append('retry refused media providers')

          # The browser converter handles the formats Cloudflare cannot
          # encode natively. Keep the Worker response honest: it always gets
          # a real MP3, then the browser makes FLAC/M4A/AAC/Opus.
          p = Path('src/app/page.tsx')
          s = p.read_text()
          if "import { FFmpeg } from '@ffmpeg/ffmpeg';" not in s:
              anchor = "import Captcha from '@/components/captcha';\n"
              if anchor not in s:
                  raise SystemExit('Could not find Captcha import anchor')
              s = s.replace(anchor, anchor + "import { FFmpeg } from '@ffmpeg/ffmpeg';\nimport { toBlobURL } from '@ffmpeg/util';\n", 1)

          marker = "type ReportIssue = 'dead' | 'unsafe' | 'wrong' | 'other';"
          helper = r'''type BrowserAudioTarget = 'flac' | 'm4a' | 'aac' | 'opus';

let browserFfmpegPromise: Promise<FFmpeg> | null = null;

async function getBrowserFfmpeg(): Promise<FFmpeg> {
  if (!browserFfmpegPromise) {
    browserFfmpegPromise = (async () => {
      const ffmpeg = new FFmpeg();
      const base = 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/esm';
      await ffmpeg.load({
        coreURL: await toBlobURL(`${base}/ffmpeg-core.js`, 'text/javascript'),
        wasmURL: await toBlobURL(`${base}/ffmpeg-core.wasm`, 'application/wasm'),
      });
      return ffmpeg;
    })().catch(err => {
      browserFfmpegPromise = null;
      throw err;
    });
  }
  return browserFfmpegPromise;
}

async function convertMp3InBrowser(mp3: Blob, target: BrowserAudioTarget, bitrate: string): Promise<Blob> {
  const ffmpeg = await getBrowserFfmpeg();
  await ffmpeg.writeFile('input.mp3', new Uint8Array(await mp3.arrayBuffer()));
  const kbps = /^\d+$/.test(bitrate) ? bitrate : '192';
  const jobs: Record<BrowserAudioTarget, { output: string; mime: string; args: string[] }> = {
    flac: { output: 'output.flac', mime: 'audio/flac', args: ['-i', 'input.mp3', '-vn', '-c:a', 'flac', 'output.flac'] },
    m4a: { output: 'output.m4a', mime: 'audio/mp4', args: ['-i', 'input.mp3', '-vn', '-c:a', 'aac', '-b:a', `${kbps}k`, 'output.m4a'] },
    aac: { output: 'output.aac', mime: 'audio/aac', args: ['-i', 'input.mp3', '-vn', '-c:a', 'aac', '-b:a', `${kbps}k`, '-f', 'adts', 'output.aac'] },
    opus: { output: 'output.opus', mime: 'audio/ogg', args: ['-i', 'input.mp3', '-vn', '-c:a', 'libopus', '-b:a', `${kbps}k`, '-f', 'ogg', 'output.opus'] },
  };
  const job = jobs[target];
  const code = await ffmpeg.exec(job.args);
  if (code !== 0) throw new Error(`Browser audio conversion failed (${target.toUpperCase()}).`);
  const data = await ffmpeg.readFile(job.output);
  await ffmpeg.deleteFile('input.mp3').catch(() => {});
  await ffmpeg.deleteFile(job.output).catch(() => {});
  return new Blob([data as Uint8Array<ArrayBuffer>], { type: job.mime });
}

function saveBrowserAudio(blob: Blob, title: string, extension: BrowserAudioTarget): void {
  const objectUrl = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = objectUrl;
  link.download = `${(title || 'download').replace(/[\\/:*?"<>|]+/g, '_')}.${extension}`;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(objectUrl), 60_000);
}

'''
          if 'async function convertMp3InBrowser(' not in s:
              if marker not in s:
                  raise SystemExit('Could not find ReportIssue marker')
              s = s.replace(marker, helper + marker, 1)

          start = s.index('  const downloadHere = async () => {')
          end = s.index('\n\n  const submitReport = async () => {', start)
          new_fn = r'''  const downloadHere = async () => {
    if (!videoInfo?.convertTicket || converting) return;
    const u = url.trim();
    const targetFormat = format;
    const quality = targetFormat === 'mp4' ? videoQuality : audioQuality;
    const serverFormat: FormatKey = targetFormat === 'mp4' || targetFormat === 'mp3' ? targetFormat : 'mp3';
    const href = `/api/convert?url=${encodeURIComponent(u)}&format=${serverFormat}&quality=${encodeURIComponent(quality)}&ticket=${encodeURIComponent(videoInfo.convertTicket)}&title=${encodeURIComponent(videoInfo.title || '')}`;
    setConverting(true);
    setConvertError('');
    setConvertSource('');
    try {
      const response = await fetch(href, { headers: { ...(ytCookies.trim() ? { 'X-YouTube-Cookies': ytCookies.trim() } : {}) } });
      const type = response.headers.get('content-type') || '';
      if (!response.ok || type.includes('application/json')) {
        const data = (await response.json().catch(() => ({}))) as { error?: string };
        setConvertError(data.error || 'Could not convert this link. Try a converter below.');
        return;
      }
      setConvertSource((response.headers.get('x-conversion-note') || '').trim());
      const sourceBlob = await response.blob();
      if (targetFormat === 'mp3' || targetFormat === 'mp4') {
        const objectUrl = URL.createObjectURL(sourceBlob);
        const link = document.createElement('a');
        link.href = objectUrl;
        link.download = `${(videoInfo.title || 'download').replace(/[\\/:*?"<>|]+/g, '_')}.${targetFormat}`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(objectUrl), 60_000);
        return;
      }
      const converted = await convertMp3InBrowser(sourceBlob, targetFormat, audioQuality);
      saveBrowserAudio(converted, videoInfo.title || 'download', targetFormat);
    } catch (err) {
      setConvertError(err instanceof Error && err.message ? err.message : 'Could not convert this link. Try a converter below.');
    } finally {
      setConverting(false);
    }
  };'''
          s = s[:start] + new_fn + s[end:]
          p.write_text(s)
          changed.append('browser FFmpeg conversion')

          if not changed:
              raise SystemExit('No changes made')

          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', 'package.json', 'package-lock.json', 'src/app/page.tsx', 'src/lib/extract.ts', 'src/lib/cobalt.ts', 'src/app/api/convert/route.ts'], check=True)
          subprocess.run(['git', 'commit', '-m', 'fix: retry refused media providers and repair audio formats'], check=True)
          subprocess.run(['git', 'push'], check=True)
          subprocess.run(['git', 'rm', '.github/workflows/migrate-browser-audio-converter.yml'], check=True)
          subprocess.run(['git', 'commit', '-m', 'chore: remove one-shot repair workflow'], check=True)
          subprocess.run(['git', 'push'], check=True)
