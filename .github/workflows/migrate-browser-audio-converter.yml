name: Migrate browser audio converter

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install open-source FFmpeg WASM converter
        run: npm install @ffmpeg/ffmpeg@0.12.15 @ffmpeg/util@0.12.2 --save

      - name: Patch audio extraction and browser conversion
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          changed = []

          # 1. Native M4A/AAC/Opus must not be thrown away just because there
          # is no native MP3. Only an actual MP3 request needs MP3 conversion.
          p = Path('src/lib/extract.ts')
          s = p.read_text()
          old = """const needTranscodedMp3 = want === 'audio'\n    && formats.length > 0\n    && !formats.some(f => /audio\\/(mpeg|mp3)/i.test(f.mimeType || ''));"""
          new = """const needTranscodedMp3 = format === 'mp3'\n    && formats.length > 0\n    && !formats.some(f => /audio\\/(mpeg|mp3)/i.test(f.mimeType || ''));"""
          if old in s:
              s = s.replace(old, new, 1)
              changed.append('extract MP3-only routing')
          p.write_text(s)

          # 2. Cobalt must actually receive the requested Opus format and must
          # preserve that format when interpreting the response. Otherwise an
          # Opus request can be returned as MP3 and rejected by /api/convert.
          p = Path('src/lib/cobalt.ts')
          s = p.read_text()
          s2 = s.replace(
              "return interpretCobaltPayload(data, kind);",
              "return interpretCobaltPayload(data, kind, audioFormat);",
              1,
          )
          if s2 != s:
              changed.append('Cobalt Opus propagation')
              s = s2
          p.write_text(s)

          # 3. Generalise the server-side transcode failure message so it never
          # incorrectly says MP3 for a FLAC request.
          p = Path('src/app/api/convert/route.ts')
          s = p.read_text()
          old = "return json('Could not convert the audio to MP3 on this server. Try again, or use a converter below.', 502);"
          new = "return json(`Could not convert the audio to ${format.toUpperCase()} on this server. Try again, or use a converter below.`, 502);"
          if old in s:
              s = s.replace(old, new, 1)
              changed.append('generic transcode error')
          p.write_text(s)

          # 4. Browser-side FFmpeg WASM conversion. The server supplies a real
          # MP3 for FLAC/M4A/AAC/Opus; the user's browser performs the final
          # open-source conversion, avoiding native FFmpeg on Cloudflare.
          p = Path('src/app/page.tsx')
          s = p.read_text()

          if "import { FFmpeg } from '@ffmpeg/ffmpeg';" not in s:
              anchor = "import Captcha from '@/components/captcha';\n"
              imports = "import { FFmpeg } from '@ffmpeg/ffmpeg';\nimport { toBlobURL } from '@ffmpeg/util';\n"
              if anchor not in s:
                  raise SystemExit('Could not find page import anchor')
              s = s.replace(anchor, anchor + imports, 1)

          marker = "type ReportIssue = 'dead' | 'unsafe' | 'wrong' | 'other';"
          helper = r'''type BrowserAudioTarget = 'flac' | 'm4a' | 'aac' | 'opus';

let browserFfmpegPromise: Promise<FFmpeg> | null = null;

async function getBrowserFfmpeg(): Promise<FFmpeg> {
  if (!browserFfmpegPromise) {
    browserFfmpegPromise = (async () => {
      const ffmpeg = new FFmpeg();
      const base = 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/umd';
      await ffmpeg.load({
        coreURL: await toBlobURL(`${base}/ffmpeg-core.js`, 'text/javascript'),
        wasmURL: await toBlobURL(`${base}/ffmpeg-core.wasm`, 'application/wasm'),
      });
      return ffmpeg;
    })().catch(err => {
      browserFfmpegPromise = null;
      throw err;
    });
  }
  return browserFfmpegPromise;
}

async function convertMp3InBrowser(
  mp3: Blob,
  target: BrowserAudioTarget,
  bitrate: string,
): Promise<Blob> {
  const ffmpeg = await getBrowserFfmpeg();
  const input = new Uint8Array(await mp3.arrayBuffer());
  await ffmpeg.writeFile('input.mp3', input);

  const kbps = /^\d+$/.test(bitrate) ? bitrate : '192';
  let output = '';
  let mime = '';
  let args: string[] = [];

  switch (target) {
    case 'flac':
      output = 'output.flac';
      mime = 'audio/flac';
      args = ['-i', 'input.mp3', '-vn', '-c:a', 'flac', output];
      break;
    case 'm4a':
      output = 'output.m4a';
      mime = 'audio/mp4';
      args = ['-i', 'input.mp3', '-vn', '-c:a', 'aac', '-b:a', `${kbps}k`, output];
      break;
    case 'aac':
      output = 'output.aac';
      mime = 'audio/aac';
      args = ['-i', 'input.mp3', '-vn', '-c:a', 'aac', '-b:a', `${kbps}k`, '-f', 'adts', output];
      break;
    case 'opus':
      output = 'output.opus';
      mime = 'audio/ogg';
      args = ['-i', 'input.mp3', '-vn', '-c:a', 'libopus', '-b:a', `${kbps}k`, '-f', 'ogg', output];
      break;
  }

  const code = await ffmpeg.exec(args);
  if (code !== 0) throw new Error(`Open-source audio conversion failed (${target.toUpperCase()}).`);
  const data = await ffmpeg.readFile(output);
  await Promise.all([
    ffmpeg.deleteFile('input.mp3').catch(() => {}),
    ffmpeg.deleteFile(output).catch(() => {}),
  ]);
  return new Blob([data as Uint8Array<ArrayBuffer>], { type: mime });
}

function saveBrowserAudio(blob: Blob, title: string, extension: BrowserAudioTarget): void {
  const objectUrl = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = objectUrl;
  link.download = `${(title || 'download').replace(/[\\/:*?"<>|]+/g, '_')}.${extension}`;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(objectUrl), 60_000);
}

'''
          if 'async function convertMp3InBrowser(' not in s:
              if marker not in s:
                  raise SystemExit('Could not find helper insertion marker')
              s = s.replace(marker, helper + marker, 1)

          start = s.index('  const downloadHere = async () => {')
          end = s.index('\n\n  const submitReport = async () => {', start)
          new_fn = r'''  const downloadHere = async () => {
    if (!videoInfo?.convertTicket || converting) return;
    const u = url.trim();
    const targetFormat = format;
    const quality = targetFormat === 'mp4' ? videoQuality : audioQuality;
    const serverFormat: FormatKey = targetFormat === 'mp4' || targetFormat === 'mp3' ? targetFormat : 'mp3';
    const href = `/api/convert?url=${encodeURIComponent(u)}&format=${serverFormat}&quality=${encodeURIComponent(quality)}&ticket=${encodeURIComponent(videoInfo.convertTicket)}&title=${encodeURIComponent(videoInfo.title || '')}`;
    setConverting(true);
    setConvertError('');
    setConvertSource('');
    try {
      const response = await fetch(href, {
        headers: {
          ...(ytCookies.trim() ? { 'X-YouTube-Cookies': ytCookies.trim() } : {}),
        },
      });
      const type = response.headers.get('content-type') || '';
      if (!response.ok || type.includes('application/json')) {
        const data = (await response.json().catch(() => ({}))) as { error?: string };
        setConvertError(data.error || 'Could not convert this link. Try a converter below.');
        return;
      }
      setConvertSource((response.headers.get('x-conversion-note') || '').trim());

      if (targetFormat === 'mp3' || targetFormat === 'mp4') {
        const sourceBlob = await response.blob();
        const objectUrl = URL.createObjectURL(sourceBlob);
        const link = document.createElement('a');
        link.href = objectUrl;
        link.download = `${(videoInfo.title || 'download').replace(/[\\/:*?"<>|]+/g, '_')}.${targetFormat}`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(objectUrl), 60_000);
        return;
      }

      const sourceBlob = await response.blob();
      const converted = await convertMp3InBrowser(sourceBlob, targetFormat, audioQuality);
      saveBrowserAudio(converted, videoInfo.title || 'download', targetFormat);
    } catch (err) {
      setConvertError(err instanceof Error && err.message ? err.message : 'Could not convert this link. Try a converter below.');
    } finally {
      setConverting(false);
    }
  };'''
          s = s[:start] + new_fn + s[end:]
          p.write_text(s)
          changed.append('browser FFmpeg WASM conversion')

          if not changed:
              raise SystemExit('No migration changes were needed')

          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'rm', '.github/workflows/migrate-browser-audio-converter.yml'], check=True)
          subprocess.run(['git', 'add', 'package.json', 'package-lock.json', 'src/app/page.tsx', 'src/lib/extract.ts', 'src/lib/cobalt.ts', 'src/app/api/convert/route.ts'], check=True)
          subprocess.run(['git', 'commit', '-m', 'fix: repair audio stream fallbacks and browser conversion'], check=True)
          subprocess.run(['git', 'push'], check=True)
