name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    name: Typecheck, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply one-time youtubei fallback wiring
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          extract = Path('src/lib/extract.ts')
          s = extract.read_text()
          changed = False

          old = "import { youtubeEmbedFormats } from './youtube-embed';\n"
          new = old + "import { youtubeiFallbackFormats } from './youtubei-fallback';\n"
          if "from './youtubei-fallback'" not in s:
              if old not in s: raise SystemExit('extract import anchor not found')
              s = s.replace(old, new, 1); changed = True

          old = "  | 'youtube-embed'\n  | '9convert';"
          new = "  | 'youtube-embed'\n  | 'youtubei'\n  | '9convert';"
          if "  | 'youtubei'" not in s:
              if old not in s: raise SystemExit('extract union anchor not found')
              s = s.replace(old, new, 1); changed = True

          anchor = """    } else if (embed.length) {\n      formats = embed;\n      source = 'youtube-embed';\n    }\n  }\n\n  // MP3 requests:"""
          replacement = """    } else if (embed.length) {\n      formats = embed;\n      source = 'youtube-embed';\n    }\n  }\n\n  // Last-resort free youtubei.js fallback. Only accept a real progressive\n  // MP4 with audio; never relabel an adaptive video-only or audio stream.\n  if (!formats.length && format === 'mp4' && !excludedSources.has('youtubei')) {\n    try {\n      const fallbackFormats = await youtubeiFallbackFormats(id);\n      const usable = fallbackFormats.filter(f =>\n        typeof f.url === 'string' &&\n        isAllowedMediaUrl(f.url) &&\n        /video\\/(mp4|x-m4v)|application\\/mp4/i.test(f.mimeType || '') &&\n        Boolean(f.audioQuality)\n      );\n      if (usable.length) {\n        formats = usable;\n        source = 'youtubei';\n      }\n    } catch {\n      // Continue to the existing conversion farms if youtubei.js fails.\n    }\n  }\n\n  // MP3 requests:"""
          if "source = 'youtubei';" not in s:
              if anchor not in s: raise SystemExit('extract fallback anchor not found')
              s = s.replace(anchor, replacement, 1); changed = True

          old = "          'youtube-embed': 'YouTube embed fallback stream',\n          '9convert': '9Convert farm fallback',"
          new = "          'youtube-embed': 'YouTube embed fallback stream',\n          youtubei: 'youtubei.js fallback stream',\n          '9convert': '9Convert farm fallback',"
          if "youtubei: 'youtubei.js fallback stream'" not in s:
              if old not in s: raise SystemExit('extract MP3 notes anchor not found')
              s = s.replace(old, new, 1); changed = True

          old = "    'youtube-embed': 'YouTube embed fallback stream',\n    '9convert': '9Convert farm fallback',"
          new = "    'youtube-embed': 'YouTube embed fallback stream',\n    youtubei: 'youtubei.js fallback stream',\n    '9convert': '9Convert farm fallback',"
          if "    youtubei: 'youtubei.js fallback stream'" not in s:
              if old not in s: raise SystemExit('extract MP4 notes anchor not found')
              s = s.replace(old, new, 1); changed = True
          extract.write_text(s)

          route = Path('src/app/api/convert/route.ts')
          r = route.read_text()
          old = "  | 'youtube-embed'\n  | '9convert';"
          new = "  | 'youtube-embed'\n  | 'youtubei'\n  | '9convert';"
          if "  | 'youtubei'" not in r:
              if old not in r: raise SystemExit('route union anchor not found')
              r = r.replace(old, new, 1); changed = True
          old = "  'YouTube embed fallback stream': 'youtube-embed',\n  '9Convert farm fallback': '9convert',"
          new = "  'YouTube embed fallback stream': 'youtube-embed',\n  'youtubei.js fallback stream': 'youtubei',\n  '9Convert farm fallback': '9convert',"
          if "'youtubei.js fallback stream': 'youtubei'" not in r:
              if old not in r: raise SystemExit('route mapping anchor not found')
              r = r.replace(old, new, 1); changed = True
          route.write_text(r)

          if changed:
              import subprocess
              subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
              subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
              subprocess.run(['git','add','src/lib/extract.ts','src/app/api/convert/route.ts'], check=True)
              subprocess.run(['git','commit','-m','fix: wire youtubei fallback into YouTube extraction'], check=True)
              subprocess.run(['git','push'], check=True)
          PY

      - name: Remove temporary patch workflow
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          if [ -f .github/workflows/wire-youtubei-fallback.yml ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm .github/workflows/wire-youtubei-fallback.yml
            git commit -m "chore: remove temporary youtubei wiring workflow"
            git push
          fi

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Production build
        run: npm run build
