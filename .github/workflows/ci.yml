name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    name: Typecheck, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 21
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Keep this migration idempotent: it only changes the exact old code
      # shapes, then commits once. This makes the audio-format fixes
      # self-applying without repeatedly rewriting the same source on later pushes.
      - name: Ensure audio extraction and FLAC conversion fixes
        if: github.event_name == 'push'
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          changed = False

          # 1) Allow native M4A/AAC/Opus streams to survive the MP3-only gate.
          p = Path('src/lib/extract.ts')
          s = p.read_text()
          old = """  const needTranscodedMp3 = want === 'audio'
    && formats.length > 0
    && !formats.some(f => /audio\\/(mpeg|mp3)/i.test(f.mimeType || ''));"""
          new = """  const needTranscodedMp3 = format === 'mp3'
    && formats.length > 0
    && !formats.some(f => /audio\\/(mpeg|mp3)/i.test(f.mimeType || ''));"""
          if old in s and old != new:
              s = s.replace(old, new, 1)
              changed = True

          # 2) Tell the extractor that a source audio stream can be transcoded
          # to a requested target format instead of pretending the source is
          # already FLAC.
          old = "  transcodeToMp3?: boolean;\n}"
          new = "  transcodeToMp3?: boolean;\n  /** Re-encode the source audio to the requested non-MP3 audio format. */\n  transcodeToAudio?: 'flac';\n}"
          if old in s and new not in s:
              s = s.replace(old, new, 1)
              changed = True

          old_branch = "      if (native?.url) { const extension = requestedAudio === 'opus' && /audio\\/webm/i.test(native.mimeType || '') ? 'webm' : requestedAudio; return ok({ url: native.url, mimeType: native.mimeType || 'application/octet-stream', extension, qualityLabel: native.qualityLabel, note: 'Native audio stream' }); }\n      return fail(`No native ${requestedAudio.toUpperCase()} stream is available from this source. Choose another format or use a converter below.`);"
          new_branch = "      if (native?.url) { const extension = requestedAudio === 'opus' && /audio\\/webm/i.test(native.mimeType || '') ? 'webm' : requestedAudio; return ok({ url: native.url, mimeType: native.mimeType || 'application/octet-stream', extension, qualityLabel: native.qualityLabel, note: 'Native audio stream' }); }\n      if (requestedAudio === 'flac' && isTranscodeEnabled()) {\n        const best = pickYouTubeFormat(formats, 'audio', 'best');\n        if (best?.url && isAllowedMediaUrl(best.url)) {\n          return ok({\n            url: best.url,\n            mimeType: best.mimeType || 'audio/mp4',\n            extension: extensionForMime(best.mimeType || 'audio/mp4', 'm4a'),\n            qualityLabel: best.qualityLabel,\n            transcodeToAudio: 'flac',\n            note: 'Converted to FLAC on this server (ffmpeg).',\n          });\n        }\n      }\n      return fail(`No native ${requestedAudio.toUpperCase()} stream is available from this source. Choose another format or use a converter below.`);"
          if old_branch in s and new_branch not in s:
              s = s.replace(old_branch, new_branch, 1)
              changed = True
          p.write_text(s)

          # 3) Add a safe ffmpeg FLAC encoder using the existing streaming bridge.
          p = Path('src/lib/ffmpeg.ts')
          s = p.read_text()
          marker = "export function transcodeArgs(audioUrl: string, bitrateKbps: number): string[] {"
          flac_fn = '''export function transcodeFlacArgs(audioUrl: string): string[] {
  return [
    '-hide_banner',
    '-loglevel', 'error',
    '-nostdin',
    '-user_agent', BROWSER_UA,
    '-i', audioUrl,
    '-map', '0:a:0',
    '-vn',
    '-c:a', 'flac',
    '-f', 'flac',
    'pipe:1',
  ];
}

'''
          if "export function transcodeFlacArgs" not in s:
              idx = s.index(marker)
              s = s[:idx] + flac_fn + s[idx:]
              changed = True
          old_export = "export function transcodeAudioToStream(audioUrl: string, bitrateKbps: number): MuxStream | null {\n  return spawnFfmpegToStream(transcodeArgs(audioUrl, bitrateKbps));\n}"
          new_export = "export function transcodeAudioToStream(audioUrl: string, bitrateKbps: number, target: 'mp3' | 'flac' = 'mp3'): MuxStream | null {\n  return spawnFfmpegToStream(target === 'flac' ? transcodeFlacArgs(audioUrl) : transcodeArgs(audioUrl, bitrateKbps));\n}"
          if old_export in s:
              s = s.replace(old_export, new_export, 1)
              changed = True
          p.write_text(s)

          # 4) Make /api/convert invoke the real FLAC encoder and emit correct
          # FLAC headers/filename. MP3 keeps its existing behaviour.
          p = Path('src/app/api/convert/route.ts')
          s = p.read_text()
          old = "      const requestedExt = format;\n      const transcodeAvailable = format === 'mp3' && extracted.transcodeToMp3 === true && isTranscodeEnabled();"
          new = "      const requestedExt = format;\n      const transcodeAvailable = isTranscodeEnabled() && ((format === 'mp3' && extracted.transcodeToMp3 === true) || (format === 'flac' && extracted.transcodeToAudio === 'flac'));"
          if old in s:
              s = s.replace(old, new, 1)
              changed = True

          old = "      const filename = sanitizeDownloadFilename(title || 'download', transcodeAvailable ? 'mp3' : extracted.extension);"
          new = "      const filename = sanitizeDownloadFilename(title || 'download', transcodeAvailable ? format : extracted.extension);"
          if old in s:
              s = s.replace(old, new, 1)
              changed = True

          old = "        const transcodeRetryAfter = await rateLimit(`transcode:${ip}`, TRANSCODE_RATE_LIMIT);\n        if (transcodeRetryAfter > 0) return NextResponse.json({ error: 'Too many MP3 conversions. Please wait a moment and try again.' }, { status: 429, headers: { 'Retry-After': String(transcodeRetryAfter), 'Cache-Control': 'no-store' } });\n        const transcodeStream = transcodeAudioToStream(extracted.url, mp3BitrateKbps(quality));"
          new = "        const transcodeRetryAfter = await rateLimit(`transcode:${ip}`, TRANSCODE_RATE_LIMIT);\n        if (transcodeRetryAfter > 0) return NextResponse.json({ error: `Too many ${format.toUpperCase()} conversions. Please wait a moment and try again.` }, { status: 429, headers: { 'Retry-After': String(transcodeRetryAfter), 'Cache-Control': 'no-store' } });\n        const transcodeStream = transcodeAudioToStream(extracted.url, mp3BitrateKbps(quality), format === 'flac' ? 'flac' : 'mp3');"
          if old in s:
              s = s.replace(old, new, 1)
              changed = True

          old = "        if (!transcodeStream) return json('MP3 conversion is unavailable on this server.', 502);"
          new = "        if (!transcodeStream) return json(`${format.toUpperCase()} conversion is unavailable on this server. Try a converter below.`, 502);"
          if old in s:
              s = s.replace(old, new, 1)
              changed = True

          old = "        const headers = new Headers({ 'Content-Type': 'audio/mpeg', 'Content-Disposition': `attachment; filename=\"${filename.replace(/\\\"/g, '')}\"; filename*=UTF-8''${encodedName}`, 'Cache-Control': 'no-store', 'X-Content-Type-Options': 'nosniff', ...conversionNoteHeaders(extracted.note) });"
          new = "        const outputMime = format === 'flac' ? 'audio/flac' : 'audio/mpeg';\n        const headers = new Headers({ 'Content-Type': outputMime, 'Content-Disposition': `attachment; filename=\"${filename.replace(/\\\"/g, '')}\"; filename*=UTF-8''${encodedName}`, 'Cache-Control': 'no-store', 'X-Content-Type-Options': 'nosniff', ...conversionNoteHeaders(extracted.note) });"
          if old in s:
              s = s.replace(old, new, 1)
              changed = True
          p.write_text(s)

          if changed:
              subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
              subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
              subprocess.run(['git', 'add', 'src/lib/extract.ts', 'src/lib/ffmpeg.ts', 'src/app/api/convert/route.ts'], check=True)
              subprocess.run(['git', 'commit', '-m', 'fix: repair audio extraction and real FLAC conversion'], check=True)
              subprocess.run(['git', 'push'], check=True)

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Production build
        run: npm run build
