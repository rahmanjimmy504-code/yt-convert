name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    name: Typecheck, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 21
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # One-time source migration for the first-party picker. This is deliberately
      # limited to page.tsx so CI cannot duplicate media validation declarations.
      - name: Ensure first-party audio format picker is present
        if: github.event_name == 'push'
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess

          p = Path('src/app/page.tsx')
          s = p.read_text()
          old_pattern = re.compile(
              r"\{phase === 'input' && \(\s*<div className=\"space-y-2\">\s*<label className=\"text-sm font-semibold\">Format</label>\s*<div className=\"grid grid-cols-2 h-11 rounded-xl bg-gray-100 dark:bg-gray-800 p-1\">.*?</div>\s*</div>\s*\)\}",
              re.S,
          )
          new_block = '''{phase === 'input' && (\n            <div className="space-y-2">\n              <label className="text-sm font-semibold">Format</label>\n              <div className="grid grid-cols-2 h-11 rounded-xl bg-gray-100 dark:bg-gray-800 p-1">\n                <button type="button" onClick={() => handleFormatChange(audioFormat)} className={'rounded-lg text-sm font-medium transition-all flex items-center justify-center gap-2 ' + (format !== 'mp4' ? 'bg-white dark:bg-gray-700 shadow-sm' : 'text-gray-500')}>\n                  <Music className="w-4 h-4" /> Audio\n                </button>\n                <button type="button" onClick={() => handleFormatChange('mp4')} className={'rounded-lg text-sm font-medium transition-all flex items-center justify-center gap-2 ' + (format === 'mp4' ? 'bg-white dark:bg-gray-700 shadow-sm' : 'text-gray-500')}>\n                  <Film className="w-4 h-4" /> Video\n                </button>\n              </div>\n              {format !== 'mp4' && (\n                <div className="grid grid-cols-5 gap-1.5 pt-1">\n                  {AUDIO_FORMAT_OPTIONS.map(f => (\n                    <button key={f} type="button" onClick={() => { setAudioFormat(f); setFormat(f); sSet('yt-convert-format', f); }} aria-pressed={audioFormat === f} className={'h-9 rounded-lg text-[11px] font-semibold border transition-colors ' + (audioFormat === f ? 'bg-red-600 text-white border-red-600' : 'bg-gray-50 dark:bg-gray-800 text-gray-600 dark:text-gray-300 border-gray-200 dark:border-gray-700 hover:border-red-300 dark:hover:border-red-800')}>{f.toUpperCase()}</button>\n                  ))}\n                </div>\n              )}\n            </div>\n          )}'''
          changed = False
          if old_pattern.search(s):
              s2 = old_pattern.sub(new_block, s, count=1)
              if s2 != s:
                  p.write_text(s2)
                  changed = True

          # Make the saved selection migration accept all audio formats.
          s = p.read_text()
          old_saved = "    if (f === 'mp3' || f === 'mp4') setFormat(f);\n    else if (f === 'audio') setFormat('mp3'); // migrate legacy value"
          new_saved = "    if ((['flac', 'mp3', 'm4a', 'aac', 'opus'] as readonly string[]).includes(f)) { setFormat(f as FormatKey); setAudioFormat(f as Exclude<FormatKey, 'mp4'>); }\n    else if (f === 'mp4') setFormat('mp4');\n    else if (f === 'audio') { setFormat('mp3'); setAudioFormat('mp3'); } // migrate legacy value"
          if old_saved in s:
              p.write_text(s.replace(old_saved, new_saved, 1))
              changed = True

          if changed:
              subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
              subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
              subprocess.run(['git', 'add', 'src/app/page.tsx'], check=True)
              subprocess.run(['git', 'commit', '-m', 'feat: show audio file types in download picker'], check=True)
              subprocess.run(['git', 'push'], check=True)

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Production build
        run: npm run build
