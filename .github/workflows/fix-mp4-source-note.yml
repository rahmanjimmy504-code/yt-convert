name: Fix MP4 source provenance

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add MP4 source note
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/extract.ts')
          s = p.read_text()
          old = "    qualityLabel: picked.qualityLabel,\n    note: notes[source],\n  });"
          new = "    qualityLabel: picked.qualityLabel,\n    note: notes[source] || 'Innertube stream',\n  });"
          if old not in s:
              raise SystemExit('MP4 source note target not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/extract.ts
          git diff --cached --quiet || git commit -m 'fix: preserve MP4 source provenance for retries'
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/fix-mp4-source-note.yml
          git add .github/workflows/fix-mp4-source-note.yml
          git commit -m 'chore: remove temporary MP4 note workflow'
          git push
