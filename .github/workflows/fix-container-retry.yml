name: Fix media container retry

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Increase wrong-container retries
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/api/convert/route.ts')
          s = p.read_text()
          old = 'const MAX_CONVERT_ATTEMPTS = 2;'
          new = 'const MAX_CONVERT_ATTEMPTS = 3;'
          if old not in s:
              raise SystemExit('target retry constant not found')
          s = s.replace(old, new, 1)
          s = s.replace(
              '// Bounded auto-retry: the whole conversion runs at most twice. The ONLY\n'
              '// thing that consumes attempt 2 is a wrong-container sniff verdict',
              '// Bounded auto-retry: wrong-container media responses get up to three\n'
              '// fresh extraction attempts. Only a wrong-container sniff verdict',
              1,
          )
          s = s.replace(
              '// second billed Actor run for the same request.\n */',
              '// second billed Actor run for the same request.\n */',
              1,
          )
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/api/convert/route.ts
          git diff --cached --quiet || git commit -m 'fix: retry wrong media containers more reliably'
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/fix-container-retry.yml
          git add .github/workflows/fix-container-retry.yml
          git commit -m 'chore: remove temporary container retry workflow'
          git push
