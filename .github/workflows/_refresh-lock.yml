name: Refresh dependency lockfile

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Refresh package-lock.json
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit refreshed lockfile and remove helper workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git rm .github/workflows/_refresh-lock.yml
          if git diff --cached --quiet; then
            echo 'No lockfile changes needed.'
            exit 0
          fi
          git commit -m 'Refresh package lockfile for youtubei.js'
          git push
