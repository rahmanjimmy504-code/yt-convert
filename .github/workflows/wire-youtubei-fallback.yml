name: Wire youtubei fallback

on:
  push:
    paths:
      - .github/workflows/wire-youtubei-fallback.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire youtubei fallback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          extract = Path('src/lib/extract.ts')
          s = extract.read_text()

          old = "import { youtubeEmbedFormats } from './youtube-embed';\n"
          new = old + "import { youtubeiFallbackFormats } from './youtubei-fallback';\n"
          if "from './youtubei-fallback'" not in s:
              if old not in s:
                  raise SystemExit('extract import anchor not found')
              s = s.replace(old, new, 1)

          old = "  | 'youtube-embed'\n  | '9convert';"
          new = "  | 'youtube-embed'\n  | 'youtubei'\n  | '9convert';"
          if "  | 'youtubei'" not in s:
              if old not in s:
                  raise SystemExit('extract source union anchor not found')
              s = s.replace(old, new, 1)

          anchor = """    } else if (embed.length) {\n      formats = embed;\n      source = 'youtube-embed';\n    }\n  }\n\n  // MP3 requests:"""
          replacement = """    } else if (embed.length) {\n      formats = embed;\n      source = 'youtube-embed';\n    }\n  }\n\n  // Last-resort free InnerTube client fallback. youtubei.js has its own\n  // client/session implementation, so it gets a chance after the native\n  // extractor and public mirrors but before conversion farms. Only use it for\n  // MP4 here: its direct format list must contain an actual progressive MP4\n  // with audio; adaptive video-only tracks are not silently relabelled.\n  if (!formats.length && format === 'mp4' && !excludedSources.has('youtubei')) {\n    try {\n      const fallbackFormats = await youtubeiFallbackFormats(id);\n      const usable = fallbackFormats.filter(f =>\n        typeof f.url === 'string' &&\n        isAllowedMediaUrl(f.url) &&\n        /video\\/(mp4|x-m4v)|application\\/mp4/i.test(f.mimeType || '') &&\n        Boolean(f.audioQuality)\n      );\n      if (usable.length) {\n        formats = usable;\n        source = 'youtubei';\n      }\n    } catch {\n      // Keep the existing farm/converter chain untouched if youtubei.js fails.\n    }\n  }\n\n  // MP3 requests:"""
          if "source = 'youtubei';" not in s:
              if anchor not in s:
                  raise SystemExit('extract fallback anchor not found')
              s = s.replace(anchor, replacement, 1)

          old = "          'youtube-embed': 'YouTube embed fallback stream',\n          '9convert': '9Convert farm fallback',"
          new = "          'youtube-embed': 'YouTube embed fallback stream',\n          youtubei: 'youtubei.js fallback stream',\n          '9convert': '9Convert farm fallback',"
          if "youtubei: 'youtubei.js fallback stream'" not in s:
              if old not in s:
                  raise SystemExit('extract MP3 notes anchor not found')
              s = s.replace(old, new, 1)

          old = "    'youtube-embed': 'YouTube embed fallback stream',\n    '9convert': '9Convert farm fallback',"
          new = "    'youtube-embed': 'YouTube embed fallback stream',\n    youtubei: 'youtubei.js fallback stream',\n    '9convert': '9Convert farm fallback',"
          if "    youtubei: 'youtubei.js fallback stream'" not in s:
              if old not in s:
                  raise SystemExit('extract MP4 notes anchor not found')
              s = s.replace(old, new, 1)

          extract.write_text(s)

          route = Path('src/app/api/convert/route.ts')
          r = route.read_text()
          old = "  | 'youtube-embed'\n  | '9convert';"
          new = "  | 'youtube-embed'\n  | 'youtubei'\n  | '9convert';"
          if "  | 'youtubei'" not in r:
              if old not in r:
                  raise SystemExit('route source union anchor not found')
              r = r.replace(old, new, 1)
          old = "  'YouTube embed fallback stream': 'youtube-embed',\n  '9Convert farm fallback': '9convert',"
          new = "  'YouTube embed fallback stream': 'youtube-embed',\n  'youtubei.js fallback stream': 'youtubei',\n  '9Convert farm fallback': '9convert',"
          if "'youtubei.js fallback stream': 'youtubei'" not in r:
              if old not in r:
                  raise SystemExit('route source mapping anchor not found')
              r = r.replace(old, new, 1)
          route.write_text(r)
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/extract.ts src/app/api/convert/route.ts
          git diff --cached --quiet && echo "No changes needed" && exit 0
          git commit -m "fix: wire youtubei fallback into YouTube extraction"
          git push

      - name: Remove temporary workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/wire-youtubei-fallback.yml
          git commit -m "chore: remove temporary youtubei wiring workflow"
          git push

# Trigger the temporary patch workflow now that the workflow file exists on main.
