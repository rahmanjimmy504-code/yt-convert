name: SDK

on:
  push:
    branches: [main]
    paths:
      - 'packages/yt-convert-sdk/**'
      - '.github/workflows/sdk.yml'
  pull_request:
    paths:
      - 'packages/yt-convert-sdk/**'
      - '.github/workflows/sdk.yml'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    name: Build SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/yt-convert-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/yt-convert-sdk/package.json

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

  publish:
    name: Publish to npm
    if: github.event_name == 'release'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/yt-convert-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install

      - name: Publish package
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
