# SPDX-License-Identifier: GPL-3.0-or-later
# Signed release APK + AAB, published as a GitHub Release (and a v<version>
# git tag, which is F-Droid's release marker).
name: Android release APK/AAB

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (becomes the git tag, e.g. 1.0 -> v1.0)'
        required: true
        default: '1.0'

permissions:
  contents: write
  models: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build and publish signed release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build web bundle
        run: npm run build

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android-app/android

      - name: Sync web assets into the native project
        run: npx cap sync android

      - name: Prepare release signing
        env:
          STORED_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORED_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          STORED_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORED_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$STORED_KEYSTORE" ]; then
            echo "Using the stored ANDROID_KEYSTORE_BASE64 secret."
            echo "$STORED_KEYSTORE" | base64 --decode > android/release.keystore
            {
              echo "ANDROID_KEYSTORE_FILE=$PWD/android/release.keystore"
              echo "ANDROID_KEYSTORE_PASSWORD=$STORED_STORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$STORED_KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$STORED_STORE_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "No stored keystore secret — generating a throwaway keystore."
            PASS="$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-20)"
            keytool -genkeypair -v -keystore android/release.keystore \
              -alias release -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=YT Convert, O=yt-convert" > /dev/null
            KB64="$(base64 -w0 android/release.keystore)"
            {
              echo "ANDROID_KEYSTORE_FILE=$PWD/android/release.keystore"
              echo "ANDROID_KEYSTORE_PASSWORD=$PASS"
              echo "ANDROID_KEY_ALIAS=release"
              echo "ANDROID_KEY_PASSWORD=$PASS"
            } >> "$GITHUB_ENV"
            {
              echo "### :rotating_light: SAVE THESE SIGNING SECRETS"
              echo ""
              echo "Add these as repository secrets so future releases keep the same signature:"
              echo ""
              echo "- \`ANDROID_KEYSTORE_BASE64\` = \`${KB64}\`"
              echo "- \`ANDROID_KEYSTORE_PASSWORD\` = \`${PASS}\`"
              echo "- \`ANDROID_KEY_ALIAS\` = \`release\`"
              echo "- \`ANDROID_KEY_PASSWORD\` = \`${PASS}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Assemble signed release APK
        working-directory: android-app/android
        run: ./gradlew --no-daemon assembleRelease

      - name: Bundle signed release AAB
        working-directory: android-app/android
        run: ./gradlew --no-daemon bundleRelease

      - name: Report outputs
        working-directory: android-app/android
        run: |
          ls -lh app/build/outputs/apk/release/app-release.apk app/build/outputs/bundle/release/app-release.aab

      - name: Draft Android release notes with AI
        working-directory: .
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/android-release-intelligence.py --version "$RELEASE_VERSION" --out "$GITHUB_WORKSPACE/android-release-notes.md"
          cat "$GITHUB_WORKSPACE/android-release-notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK + AAB as run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yt-convert-release
          path: |
            android-app/android/app/build/outputs/apk/release/app-release.apk
            android-app/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: YT Convert ${{ github.event.inputs.version }}
          body_path: android-release-notes.md
          files: |
            android-app/android/app/build/outputs/apk/release/app-release.apk
            android-app/android/app/build/outputs/bundle/release/app-release.aab
