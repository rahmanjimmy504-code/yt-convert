# Deploys the OpenNext build to Cloudflare Workers (docs/setup-cloudflare.md).
#
# Trigger it from the Actions tab ("Run workflow"), or let it run on pushes to
# main. Until the Cloudflare credentials are added it finishes green with a
# "skipped — token missing" warning, so an empty Actions setup does not fail CI.

name: Deploy to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'next.config.ts'
      - 'open-next.config.ts'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-cloudflare.yml'

permissions:
  contents: read

jobs:
  # Gate on credentials so a missing-token run is a clean no-op, not a failure.
  check:
    name: Check Cloudflare credentials
    runs-on: ubuntu-latest
    outputs:
      have_credentials: ${{ steps.check.outputs.have_credentials }}
    steps:
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "have_credentials=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_credentials=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Skipped — token missing
        if: steps.check.outputs.have_credentials == 'false'
        run: |
          echo "::warning title=Cloudflare deploy skipped::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID are not set. Add them under Settings → Secrets and variables → Actions, then run this workflow again (see docs/setup-cloudflare.md)."
          echo "skipped — token missing"

  deploy:
    name: Build and deploy Worker
    needs: check
    if: needs.check.outputs.have_credentials == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # wrangler 4.87+ requires Node 22; the other workflows stay on 20
          # because they only run `next build`/`tsc`, never wrangler.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the Workers bundle
        run: npm run cf:build
        env:
          # Public canonical URL, inlined at build time. Empty on first deploy;
          # set the NEXT_PUBLIC_SITE_URL Actions variable to the *.workers.dev
          # URL (printed by the deploy step) and re-run. See docs/setup-cloudflare.md.
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

      - name: Upload runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CAPTCHA_SECRET: ${{ secrets.CAPTCHA_SECRET }}
          CONVERT_TICKET_SECRET: ${{ secrets.CONVERT_TICKET_SECRET }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -e
          for name in CAPTCHA_SECRET CONVERT_TICKET_SECRET ADMIN_TOKEN; do
            eval "value=\"\${$name}\""
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name"
            fi
          done

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run cf:deploy
