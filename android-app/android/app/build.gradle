apply plugin: 'com.android.application'
// The in-app Capacitor plugins (YTExtractor) are written in Kotlin.
apply plugin: 'kotlin-android'

android {
    namespace "io.github.rahmanjimmy504.ytconvert"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.rahmanjimmy504.ytconvert"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // The runner image's default NDK; pinning avoids a multi-hundred-MB
        // SDK auto-download (and any license/network flake that comes with it).
        ndkVersion "27.3.13750724"
        externalNativeBuild {
            cmake {
                // LAME is plain C with no C++ runtime dependency; skipping the
                // STL keeps libytconvert_mp3.so small.
                arguments "-DANDROID_STL=none"
            }
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    externalNativeBuild {
        cmake {
            // Vendored LAME MP3 encoder + JNI wrapper (see src/main/cpp/).
            path "src/main/cpp/CMakeLists.txt"
            // Version shipped with the CI runner image (and current Android
            // Studio); 3.22.1 is no longer preinstalled there.
            version "3.31.5"
        }
    }
    // Release signing. The keystore and its passwords come from the CI
    // environment (the android-release workflow decodes ANDROID_KEYSTORE_BASE64
    // to a file and exports the password/alias variables) or, for local signed
    // builds, from a git-ignored keystore.properties next to this project.
    // When neither is present the release build type is left *unsigned* so
    // plain local builds and the debug CI keep working exactly as before —
    // signing material is never required to compile the app.
    signingConfigs {
        release {
            def props = new Properties()
            def propsFile = rootProject.file("keystore.properties")
            if (propsFile.exists()) {
                props.load(new FileInputStream(propsFile))
            }
            storeFile file(System.getenv("ANDROID_KEYSTORE_FILE") ?: props.getProperty("storeFile", "release.keystore"))
            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: props.getProperty("storePassword", "")
            keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: props.getProperty("keyAlias", "")
            keyPassword System.getenv("ANDROID_KEY_PASSWORD") ?: props.getProperty("keyPassword", "")
        }
    }
    buildTypes {
        debug {
            // CI ships this build type. The suffix lets a tester keep a signed
            // release installed at the same time.
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            // Sign only when a keystore was actually provided. A missing or
            // empty keystore leaves the release unsigned rather than failing
            // the build (the release workflow always provides one).
            if (signingConfigs.release.storeFile.exists() && signingConfigs.release.storePassword) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    kotlinOptions {
        // Match the Java 21 compileOptions set in capacitor.build.gradle.
        jvmTarget = '21'
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    // JVM unit tests parse/build JSON with the real org.json implementation
    // (the copy inside android.jar is a stub that throws at runtime).
    testImplementation "org.json:json:20240303"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
