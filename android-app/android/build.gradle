// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'
        // Kotlin for the in-app Capacitor plugins (YTExtractor). Keep this in
        // step with kotlinVersion in variables.gradle — the buildscript block
        // cannot read variables.gradle, so the version is repeated here.
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.25'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// TEMPORARY CI diagnostics: surface failing-task errors as GitHub workflow
// annotations (readable via the Checks API) while job-log download is not
// available to the maintainer's tooling. Remove once the build is green.
gradle.taskGraph.afterTask { task ->
    def failure = task.state.failure
    if (failure != null) {
        def sb = new StringBuilder()
        sb.append(task.path).append(' failed: ').append(failure.toString())
        def cause = failure.cause
        def depth = 0
        while (cause != null && depth < 3) {
            sb.append('%0Acaused by: ').append(cause.toString())
            cause = cause.cause
            depth++
        }
        def msgLines = (failure.message ?: '').readLines().take(40)
        if (msgLines) {
            sb.append('%0Amessage:%0A').append(msgLines.join('%0A'))
        }
        println('::error title=Gradle task failure::' + sb.toString())
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
