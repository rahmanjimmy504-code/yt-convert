# PO-token sidecar for yt-convert.
#
# Quick start:
#   1. cp .env.example .env  and set AUTH_TOKEN to a long random value
#   2. docker compose up -d --build
#   3. Run the yt-convert website on this same host/egress and set:
#         PO_TOKEN_SERVER_URL=http://127.0.0.1:4416
#         PO_TOKEN_SERVER_AUTH=<the same AUTH_TOKEN>
#      Prefer the repository-root Compose stack, which keeps this port private.
#      A sidecar here plus the website on Vercel does not satisfy YouTube's
#      same-public-IP binding and will not clear that Vercel IP's bot wall.
#
# The container never needs users' cookies; it only mints tokens from YouTube.

services:
  po-token:
    build: .
    image: yt-convert-po-token-server:latest
    container_name: yt-convert-po-token
    restart: unless-stopped
    ports:
      - "4416:4416"
    environment:
      PORT: "4416"
      HOST: "0.0.0.0"
      AUTH_TOKEN: "${AUTH_TOKEN}"
      TOKEN_TTL_MS: "${TOKEN_TTL_MS:-1800000}"
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
